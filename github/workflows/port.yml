name: port-filevault
on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从 dev 搬入新增文件
        run: |
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git fetch origin dev
          git checkout -B port origin/main
          rm -f result.txt
          FILES="lib/chat-document-import.ts components/chat/chat-doc-import.tsx styles/chat-doc-import.css lib/mixology/file-vault.ts components/mixology/mix-file-vault.tsx styles/mix-file-vault.css lib/worldbook-file-vault.ts components/settings/worldbook-file-vault.tsx styles/worldbook-file-vault.css custom-apps/file-vault"
          for f in $FILES; do
            if git cat-file -e origin/dev:"$f" 2>/dev/null; then
              git checkout origin/dev -- "$f"
              echo "OK $f" >> result.txt
            else
              echo "MISS $f" >> result.txt
            fi
          done
          cat result.txt
          git add -A
          git commit -m "feat: 搬入文件库三线适配的新增文件" || true
          git push origin port:feat/filevault --force
