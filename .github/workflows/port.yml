name: cleanup
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: clean
        run: |
          git rm -f netlify.txt npm.txt tsc.txt report.txt components/viewport-debug-badge.tsx || true
          sed -i '/ViewportDebugBadge/d' app/layout.tsx
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add -A
          git commit -m "chore: 清掉临时诊断组件与日志" || true
          git push origin HEAD:main
      - name: build-and-publish
        continue-on-error: true
        run: |
          cat > pub.py <<'PY'
          import json, time, urllib.request, urllib.error
          T = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          B = "https://api.netlify.com/api/v1"
          S = "aefc0064-d8ec-4513-876a-7433ae01d0f6"
          def call(m, p, body=None):
              d = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(B + p, data=d, method=m)
              r.add_header("Authorization", "Bearer " + T)
              r.add_header("Content-Type", "application/json")
              r.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(r, timeout=90) as x:
                      return x.status, x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
              except Exception as e:
                  return 0, str(e)[:200]
          time.sleep(5)
          st, raw = call("POST", "/sites/" + S + "/builds?branch=main", {})
          print("BUILD", st, raw[:160], flush=True)
          try:
              bid = json.loads(raw)["id"]
          except Exception:
              raise SystemExit(0)
          dep = None
          for i in range(40):
              time.sleep(10)
              st, raw = call("GET", "/sites/" + S + "/builds/" + bid)
              try:
                  d = json.loads(raw)
              except Exception:
                  continue
              dep = d.get("deploy_id") or dep
              if d.get("done"):
                  print("DONE", i, d.get("error"), flush=True)
                  break
          if not dep:
              raise SystemExit(0)
          st, raw = call("POST", "/sites/" + S + "/deploys/" + dep + "/restore", {})
          print("RESTORE", st, flush=True)
          st, raw = call("GET", "/sites/" + S)
          try:
              pd = (json.loads(raw).get("published_deploy") or {})
              print("LIVE", pd.get("branch"), str(pd.get("commit_ref"))[:10], flush=True)
          except Exception:
              print("READFAIL", flush=True)
          PY
          python3 pub.py > cleanup.txt 2>&1 || true
          cat cleanup.txt
      - name: save
        if: always()
        run: |
          rm -f pub.py
          git rm -f cleanup.txt || true
          git commit -m "chore: 清理" || true
