name: dump-diff
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: dump
        run: |
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git fetch origin main dev feat/filevault
          mkdir -p _diffs/dev _diffs/main
          BASE=$(git merge-base origin/main origin/dev || true)
          echo "BASE=$BASE" > _diffs/base.txt
          git rev-parse origin/main origin/dev >> _diffs/base.txt
          FILES="lib/mascot-chat-store.ts components/chat/chat-room.tsx components/chat/mascot-chat-room.tsx components/mixology/mixology-app.tsx components/settings/worldbook-manager.tsx"
          for f in $FILES; do
            n=$(echo $f | tr '/' '_')
            git show origin/dev:$f > _diffs/dev/$n
            git show origin/main:$f > _diffs/main/$n
            if [ -n "$BASE" ]; then
              git diff $BASE origin/dev -- "$f" > _diffs/$n.diff || true
            else
              diff -u _diffs/main/$n _diffs/dev/$n > _diffs/$n.diff || true
            fi
            echo "$n $(wc -l < _diffs/$n.diff)" >> _diffs/base.txt
          done
          git checkout -B diffdump origin/feat/filevault
          git add -A
          git commit -m "chore: dump diffs" || true
          git push -f origin diffdump
