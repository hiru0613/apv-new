name: netlify-publish-main
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: probe
        continue-on-error: true
        run: |
          cat > probe.py <<'PY'
          import json, time, urllib.request, urllib.error
          TOKEN = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          BASE = "https://api.netlify.com/api/v1"
          SID = "aefc0064-d8ec-4513-876a-7433ae01d0f6"
          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(BASE + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Content-Type", "application/json")
              req.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]
              except Exception as e:
                  return 0, str(e)[:200]
          st, raw = call("POST", "/sites/" + SID + "/builds?branch=main&clear_cache=true", {})
          print("START", st, raw[:300], flush=True)
          try:
              build_id = json.loads(raw)["id"]
          except Exception:
              print("NO_BUILD_ID", flush=True)
              raise SystemExit(0)
          deploy_id = None
          for i in range(45):
              time.sleep(10)
              st, raw = call("GET", "/sites/" + SID + "/builds/" + build_id)
              try:
                  d = json.loads(raw)
              except Exception:
                  print("poll", i, st, raw[:120], flush=True)
                  continue
              deploy_id = d.get("deploy_id") or deploy_id
              print("poll", i, "done=", d.get("done"), "err=", d.get("error"), "deploy=", deploy_id, flush=True)
              if d.get("done"):
                  break
          if not deploy_id:
              print("NO_DEPLOY_ID", flush=True)
              raise SystemExit(0)
          st, raw = call("POST", "/sites/" + SID + "/deploys/" + deploy_id + "/restore", {})
          print("RESTORE", st, raw[:300], flush=True)
          st, raw = call("GET", "/sites/" + SID)
          try:
              d = json.loads(raw)
              pd = d.get("published_deploy") or {}
              print("LIVE branch=", pd.get("branch"), "sha=", str(pd.get("commit_ref"))[:10], "at=", pd.get("published_at"), flush=True)
          except Exception:
              print("READBACK_FAIL", flush=True)
      - name: save
        if: always()
        run: |
          rm -f probe.py
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add netlify.txt
          git commit -m "chore: netlify 发布 main" || true
          git push origin HEAD:main
