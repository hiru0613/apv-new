name: fit-height2
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: patch
        run: |
          python3 - <<'PY'
          import io, re
          p = "components/desktop-shell.tsx"
          s = io.open(p, encoding="utf-8").read()
          print("count_shell_guard", s.count("if (!shell) return;"))
          if "getBoundingClientRect().height" in s and "de.style.height" in s:
              print("ALREADY")
              raise SystemExit(0)
          pat = re.compile(r'(\n)(\s*)(const shell = document\.querySelector\("\.phone-shell-wrap"\);\n\s*if \(!shell\) return;)')
          m = pat.search(s)
          if not m:
              print("NO_MATCH")
              raise SystemExit(1)
          ind = m.group(2)
          block = (m.group(3) + "\n"
                   + ind + 'const want = Math.round(shell.getBoundingClientRect().height);\n'
                   + ind + 'const deEl = document.documentElement;\n'
                   + ind + 'if (want > 0 && Math.abs(deEl.clientHeight - want) > 2) {\n'
                   + ind + '  deEl.style.height = want + "px";\n'
                   + ind + '  document.body.style.height = want + "px";\n'
                   + ind + '  document.body.style.overflow = "hidden";\n'
                   + ind + '}')
          s = s[:m.start(3)] + block + s[m.end(3):]
          io.open(p, "w", encoding="utf-8").write(s)
          print("FIT_OK")
          PY
          grep -n "const want = Math.round" components/desktop-shell.tsx
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add -A
          git commit -m "fix: 页面高度跟随外壳" || true
          git push origin HEAD:main
      - name: build-and-publish
        continue-on-error: true
        run: |
          cat > pub.py <<'PY'
          import json, time, urllib.request, urllib.error
          T = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          B = "https://api.netlify.com/api/v1"
          S = "aefc0064-d8ec-4513-876a-7433ae01d0f6"
          def call(m, p, body=None):
              d = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(B + p, data=d, method=m)
              r.add_header("Authorization", "Bearer " + T)
              r.add_header("Content-Type", "application/json")
              r.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(r, timeout=90) as x:
                      return x.status, x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:200]
              except Exception as e:
                  return 0, str(e)[:200]
          time.sleep(5)
          st, raw = call("POST", "/sites/" + S + "/builds?branch=main", {})
          try:
              bid = json.loads(raw)["id"]
          except Exception:
              print("NO_BUILD", st, raw[:120], flush=True)
              raise SystemExit(0)
          dep = None
          for i in range(40):
              time.sleep(10)
              st, raw = call("GET", "/sites/" + S + "/builds/" + bid)
              try:
                  d = json.loads(raw)
              except Exception:
                  continue
              dep = d.get("deploy_id") or dep
              if d.get("done"):
                  print("DONE", i, d.get("error"), flush=True)
                  break
          if not dep:
              raise SystemExit(0)
          st, raw = call("POST", "/sites/" + S + "/deploys/" + dep + "/restore", {})
          print("RESTORE", st, flush=True)
          PY
          python3 pub.py > cleanup.txt 2>&1 || true
          cat cleanup.txt
