name: netlify-branch
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: probe
        continue-on-error: true
        run: |
          echo "=== try ===" > netlify.txt
          cat > probe.py <<'PY'
          import json, traceback, urllib.request, urllib.error

          TOKEN = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          BASE = "https://api.netlify.com/api/v1"
          SID = "aefc0064-d8ec-4513-876a-7433ae01d0f6"

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(BASE + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Content-Type", "application/json")
              req.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
              except Exception as e:
                  return 0, str(e)[:200]

          def branch_of(raw):
              try:
                  return (json.loads(raw).get("build_settings") or {}).get("repo_branch")
              except Exception:
                  return "?"

          FULL = {
              "cmd": "npm run build",
              "dir": ".next",
              "allowed_branches": ["main", "dev"],
              "installation_id": 171354416,
              "provider": "github",
              "repo_type": "git",
              "repo_url": "https://github.com/hiru0613/apv-new",
              "repo_path": "hiru0613/apv-new",
              "repo_branch": "main",
          }

          attempts = [
              ("full", {"build_settings": dict(FULL)}),
              ("full-main-only", {"build_settings": dict(FULL, allowed_branches=["main"])}),
              ("partial+ids", {"build_settings": {
                  "repo_branch": "main", "provider": "github",
                  "repo_path": "hiru0613/apv-new",
                  "repo_url": "https://github.com/hiru0613/apv-new",
                  "installation_id": 171354416, "repo_type": "git",
                  "cmd": "npm run build", "dir": ".next"}}),
              ("flat", {"repo_branch": "main", "repo_path": "hiru0613/apv-new", "provider": "github"}),
          ]

          for name, body in attempts:
              st, raw = call("PATCH", "/sites/" + SID, body)
              print("%-14s patch=%s resp_branch=%s" % (name, st, branch_of(raw)), flush=True)
              if st >= 400:
                  print("   err:", raw[:200], flush=True)
              st2, raw2 = call("GET", "/sites/" + SID)
              print("   get_branch=%s" % branch_of(raw2), flush=True)
              if branch_of(raw2) == "main":
                  print("CHANGED_BY", name, flush=True)
                  break

          st, raw = call("GET", "/sites/" + SID)
          print("FINAL", branch_of(raw), flush=True)
          st, raw = call("POST", "/sites/" + SID + "/builds?clear_cache=false", {})
          print("BUILD", st, raw[:200], flush=True)

          PY
          python3 probe.py >> netlify.txt 2>&1 || true
      -
