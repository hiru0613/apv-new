name: deploy-legacy2
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: fetch-legacy
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== ls-remote ==="
            git ls-remote https://github.com/hiru0613/ai-virtual-phone0613.git main 2>&1 | head -5
            echo "=== fetch ==="
            git fetch --depth=1 https://github.com/hiru0613/ai-virtual-phone0613.git main 2>&1 | tail -5
            echo "FETCH_EXIT=$?"
            echo "=== checkout ==="
            git checkout -B legacy FETCH_HEAD 2>&1 | tail -5
            echo "CO_EXIT=$?"
            echo "=== push ==="
            git push -f origin legacy 2>&1 | tail -5
            echo "PUSH_EXIT=$?"
            echo "=== head ==="
            git log -1 --oneline
          } > steps.txt 2>&1
          cat steps.txt
      - name: save
        if: always()
        run: |
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add steps.txt
          git commit -m "chore: legacy 拉取诊断" || true
          git push origin HEAD:main
      - name: build-and-publish
        continue-on-error: true
        run: |
          cat > pub.py <<'PY'
          import json, time, urllib.request, urllib.error
          T = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          B = "https://api.netlify.com/api/v1"
          S = "aefc0064-d8ec-4513-876a-7433ae01d0f6"
          def call(m, p, body=None):
              d = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(B + p, data=d, method=m)
              r.add_header("Authorization", "Bearer " + T)
              r.add_header("Content-Type", "application/json")
              r.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(r, timeout=90) as x:
                      return x.status, x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
              except Exception as e:
                  return 0, str(e)[:200]
          st, raw = call("POST", "/sites/" + S + "/builds?branch=legacy", {})
          print("BUILD", st, raw[:200], flush=True)
          try:
              bid = json.loads(raw)["id"]
          except Exception:
              raise SystemExit(0)
          dep = None
          for i in range(50):
              time.sleep(10)
              st, raw = call("GET", "/sites/" + S + "/builds/" + bid)
              try:
                  d = json.loads(raw)
              except Exception:
                  continue
              dep = d.get("deploy_id") or dep
              if d.get("done"):
                  print("DONE", i, d.get("error"), flush=True)
                  break
          if not dep:
              print("NO_DEPLOY", flush=True)
              raise SystemExit(0)
          st, raw = call("POST", "/sites/" + S + "/deploys/" + dep + "/restore", {})
          print("RESTORE", st, flush=True)
          st, raw = call("GET", "/sites/" + S)
          try:
              pd = (json.loads(raw).get("published_deploy") or {})
              print("LIVE", pd.get("branch"), str(pd.get("commit_ref"))[:10], flush=True)
          except Exception:
              print("READFAIL", flush=True)
          PY
          python3 pub.py
