name: merge-to-main
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: merge
        run: |
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git fetch origin main feat/filevault
          git checkout -B main origin/main
          git merge --no-ff origin/feat/filevault -m "merge: 文件库三线适配 + iOS 视口复位" > /tmp/m.txt 2>&1 || true
          cat /tmp/m.txt
          if grep -q "CONFLICT" /tmp/m.txt; then echo ABORT_CONFLICT; exit 1; fi
          git rm -q -f report.txt tsc.txt npm.txt 2>/dev/null || true
          git commit -qm "chore: 清掉移植临时文件" || true
          git push origin main
