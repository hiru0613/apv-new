name: netlify-branch
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: patch-branch
        run: |
          set +e
          python3 - <<'PY' > netlify.txt 2>&1
          import json, traceback, urllib.request, urllib.error

          TOKEN = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          BASE = "https://api.netlify.com/api/v1"

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(BASE + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Content-Type", "application/json")
              req.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read().decode()
                      try:
                          return r.status, json.loads(raw or "{}"), raw
                      except Exception:
                          return r.status, None, raw
              except urllib.error.HTTPError as e:
                  return e.code, None, e.read().decode()[:500]
              except Exception as e:
                  return 0, None, str(e)[:300]

          def main():
              st, sites, raw = call("GET", "/sites?name=hiru0613")
              print("LIST status=", st, "raw_head=", raw[:200])
              if not isinstance(sites, list) or not sites:
                  st, sites, raw = call("GET", "/sites")
                  print("LIST-ALL status=", st, "raw_head=", raw[:200])
              if not isinstance(sites, list) or not sites:
                  print("NO_SITE")
                  return

              site = None
              for s in sites:
                  if not isinstance(s, dict):
                      continue
                  if str(s.get("name", "")).startswith("hiru0613") or "hiru0613" in str(s.get("url", "")):
                      site = s
                      break
              if site is None:
                  site = sites[0]

              sid = site["id"]
              bs = site.get("build_settings") or {}
              print("SITE", sid, site.get("name"), site.get("url"))
              print("BEFORE repo_branch=", bs.get("repo_branch"), "default_branch=", site.get("default_branch"))

              for i, body in enumerate([
                  {"repo_branch": "main"},
                  {"build_settings": {"repo_branch": "main"}},
                  {"repo": {"branch": "main"}},
              ], 1):
                  st, res, raw = call("PATCH", "/sites/" + sid, body)
                  print("PATCH%d" % i, json.dumps(body), "status=", st, "resp=", (raw or "")[:200])
                  st2, cur, _ = call("GET", "/sites/" + sid)
                  now = ((cur or {}).get("build_settings") or {}).get("repo_branch")
                  print("   now repo_branch=", now)
                  if now == "main":
                      break

              st, build, raw = call("POST", "/sites/" + sid + "/builds", {"clear_cache": False})
              print("BUILD status=", st, "resp=", (raw or "")[:300])

          try:
              main()
          except Exception:
              traceback.print_exc()
          PY
          cat netlify.txt
          python3 -c "import io;p='.github/workflows/port.yml';s=io.open(p,encoding='utf-8').read();io.open(p,'w',encoding='utf-8').write(s.replace('nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e','REVOKED'));print('TOKEN_SCRUBBED')"
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add -A
          git commit -m "chore: netlify 分支切换记录" || true
          git push origin HEAD:main || true
