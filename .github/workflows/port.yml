name: vp-always
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: add
        run: |
          cat > components/viewport-debug-badge.tsx <<'TSX'
          "use client";
          import { useEffect, useState } from "react";
          export function ViewportDebugBadge() {
            const [info, setInfo] = useState("");
            useEffect(() => {
              const tick = () => {
                const vv = window.visualViewport;
                const de = document.documentElement;
                const root = document.querySelector<HTMLElement>(".app-root");
                const shell = document.querySelector<HTMLElement>(".phone-shell-wrap");
                const bar = document.querySelector<HTMLElement>(".chat-input-bar");
                const r = shell ? shell.getBoundingClientRect() : null;
                const rr = root ? root.getBoundingClientRect() : null;
                const br = bar ? bar.getBoundingClientRect() : null;
                setInfo(
                  `p=${location.pathname} ih=${window.innerHeight} vv=${Math.round(vv?.height ?? 0)}/${Math.round(vv?.offsetTop ?? 0)}`
                  + ` sy=${Math.round(window.scrollY)} de=${de.clientHeight} dh=${de.scrollHeight}`
                  + ` root=${Math.round(rr?.height ?? 0)}@${Math.round(rr?.top ?? 0)}`
                  + ` shell=${Math.round(r?.height ?? 0)}@${Math.round(r?.top ?? 0)}`
                  + ` bar=${Math.round(br?.bottom ?? 0)}`
                  + ` gap=${Math.round(window.innerHeight - (r?.bottom ?? 0))}`
                );
              };
              tick();
              const id = window.setInterval(tick, 500);
              window.addEventListener("resize", tick);
              window.visualViewport?.addEventListener("resize", tick);
              window.visualViewport?.addEventListener("scroll", tick);
              return () => {
                window.clearInterval(id);
                window.removeEventListener("resize", tick);
                window.visualViewport?.removeEventListener("resize", tick);
                window.visualViewport?.removeEventListener("scroll", tick);
              };
            }, []);
            return (
              <div style={{ position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 2147483647, background: "rgba(0,0,0,0.9)", color: "#7ff", font: "9px/1.4 ui-monospace, monospace", padding: "2px 4px", pointerEvents: "none" }}>
                {info}
              </div>
            );
          }
          TSX
          sed -i '/ViewportDebugBadge/d' app/layout.tsx || true
          python3 - <<'PY'
          import io
          p = "app/layout.tsx"
          s = io.open(p, encoding="utf-8").read()
          s = s.replace('import { ChatReasoningVisibilityController } from "@/components/chat-reasoning-visibility-controller";',
                        'import { ChatReasoningVisibilityController } from "@/components/chat-reasoning-visibility-controller";\nimport { ViewportDebugBadge } from "@/components/viewport-debug-badge";')
          s = s.replace("        <ChatReasoningVisibilityController />",
                        "        <ChatReasoningVisibilityController />\n        <ViewportDebugBadge />")
          io.open(p, "w", encoding="utf-8").write(s)
          print("LAYOUT_OK")
          PY
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add -A
          git commit -m "chore: 常显视口读数" || true
          git push origin HEAD:main
      - name: build-and-publish
        continue-on-error: true
        run: |
          cat > pub.py <<'PY'
          import json, time, urllib.request, urllib.error
          T = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          B = "https://api.netlify.com/api/v1"
          S = "aefc0064-d8ec-4513-876a-7433ae01d0f6"
          def call(m, p, body=None):
              d = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(B + p, data=d, method=m)
              r.add_header("Authorization", "Bearer " + T)
              r.add_header("Content-Type", "application/json")
              r.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(r, timeout=90) as x:
                      return x.status, x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
              except Exception as e:
                  return 0, str(e)[:200]
          time.sleep(5)
          st, raw = call("POST", "/sites/" + S + "/builds?branch=main", {})
          print("BUILD", st, flush=True)
          try:
              bid = json.loads(raw)["id"]
          except Exception:
              raise SystemExit(0)
          dep = None
          for i in range(40):
              time.sleep(10)
              st, raw = call("GET", "/sites/" + S + "/builds/" + bid)
              try:
                  d = json.loads(raw)
              except Exception:
                  continue
              dep = d.get("deploy_id") or dep
              if d.get("done"):
                  print("DONE", i, flush=True)
                  break
          if not dep:
              raise SystemExit(0)
          st, raw = call("POST", "/sites/" + S + "/deploys/" + dep + "/restore", {})
          print("RESTORE", st, flush=True)
          st, raw = call("GET", "/sites/" + S)
          try:
              pd = (json.loads(raw).get("published_deploy") or {})
              print("LIVE", pd.get("branch"), str(pd.get("commit_ref"))[:10], flush=True)
          except Exception:
              print("READFAIL", flush=True)
          PY
          python3 pub.py > cleanup.txt 2>&1 || true
          cat cleanup.txt
