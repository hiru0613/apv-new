name: netlify-branch
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: probe
        continue-on-error: true
        run: |
          echo "=== env ===" > netlify.txt
          python3 --version >> netlify.txt 2>&1
          cat > probe.py <<'PY'
          import json, sys, traceback, urllib.request, urllib.error

          TOKEN = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          BASE = "https://api.netlify.com/api/v1"

          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(BASE + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Content-Type", "application/json")
              req.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]
              except Exception as e:
                  return 0, str(e)[:300]

          def main():
              st, raw = call("GET", "/sites?name=hiru0613")
              print("LIST", st, raw[:250], flush=True)
              sites = []
              try:
                  sites = json.loads(raw)
              except Exception:
                  print("LIST-NOT-JSON", flush=True)
              if not isinstance(sites, list) or not sites:
                  st, raw = call("GET", "/sites")
                  print("ALL", st, raw[:250], flush=True)
                  try:
                      sites = json.loads(raw)
                  except Exception:
                      sites = []
              if not isinstance(sites, list) or not sites:
                  print("NO_SITE", flush=True)
                  return
              site = None
              for s in sites:
                  if isinstance(s, dict) and "hiru0613" in str(s.get("url", "")) + str(s.get("name", "")):
                      site = s
                      break
              site = site or sites[0]
              sid = site["id"]
              print("SITE", sid, site.get("name"), site.get("url"), flush=True)
              print("BEFORE", (site.get("build_settings") or {}).get("repo_branch"), flush=True)
              for i, body in enumerate([{"repo_branch": "main"}, {"build_settings": {"repo_branch": "main"}}, {"repo": {"branch": "main"}}], 1):
                  st, raw = call("PATCH", "/sites/" + sid, body)
                  print("PATCH%d" % i, st, raw[:200], flush=True)
                  st2, raw2 = call("GET", "/sites/" + sid)
                  try:
                      now = (json.loads(raw2).get("build_settings") or {}).get("repo_branch")
                  except Exception:
                      now = "?"
                  print("  now=", now, flush=True)
                  if now == "main":
                      break
              st, raw = call("POST", "/sites/" + sid + "/builds", {"clear_cache": False})
              print("BUILD", st, raw[:300], flush=True)

          try:
              main()
          except Exception:
              traceback.print_exc()
          PY
          python3 probe.py >> netlify.txt 2>&1
          echo "=== done ===" >> netlify.txt
      - name: save
        if: always()
        run: |
          sed -i 's/nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e/REVOKED/g' .github/workflows/port.yml || true
          rm -f probe.py
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add -A
          git commit -m "chore: netlify 探测结果" || true
          git push origin HEAD:main || true
