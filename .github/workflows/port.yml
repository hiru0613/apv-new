name: legacy-tar
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: build-branch
        continue-on-error: true
        run: |
          set +e
          exec > steps.txt 2>&1
          set -x
          mkdir -p /tmp/old
          curl -sL -o /tmp/old.tgz https://codeload.github.com/hiru0613/ai-virtual-phone0613/tar.gz/refs/heads/main
          echo "CURL=$?"
          ls -l /tmp/old.tgz
          tar -xzf /tmp/old.tgz -C /tmp/old --strip-components=1
          echo "TAR=$?"
          ls /tmp/old | head -20
          git checkout -B legacy origin/main
          git rm -rq --ignore-unmatch .
          cp -a /tmp/old/. .
          rm -rf /tmp/old
          git add -A
          git -c user.name=kong-bot -c user.email=bot@local commit -qm "chore: 换回旧仓库代码" || true
          git push -f origin legacy
          echo "PUSH=$?"
          git log -1 --oneline
      - name: save
        if: always()
        run: |
          set +e
          git checkout main 2>/dev/null || true
          git add steps.txt 2>/dev/null
          git -c user.name=kong-bot -c user.email=bot@local commit -qm "chore: legacy 步骤日志" || true
          git push origin HEAD:main || true
      - name: build-and-publish
        continue-on-error: true
        run: |
          cat > pub.py <<'PY'
          import json, time, urllib.request, urllib.error
          T = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          B = "https://api.netlify.com/api/v1"
          S = "aefc0064-d8ec-4513-876a-7433ae01d0f6"
          def call(m, p, body=None):
              d = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(B + p, data=d, method=m)
              r.add_header("Authorization", "Bearer " + T)
              r.add_header("Content-Type", "application/json")
              r.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(r, timeout=90) as x:
                      return x.status, x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]
              except Exception as e:
                  return 0, str(e)[:200]
          st, raw = call("POST", "/sites/" + S + "/builds?branch=legacy", {})
          print("BUILD", st, raw[:200], flush=True)
          try:
              bid = json.loads(raw)["id"]
          except Exception:
              raise SystemExit(0)
          dep = None
          for i in range(50):
              time.sleep(10)
              st, raw = call("GET", "/sites/" + S + "/builds/" + bid)
              try:
                  d = json.loads(raw)
              except Exception:
                  continue
              dep = d.get("deploy_id") or dep
              if d.get("done"):
                  print("DONE", i, d.get("error"), flush=True)
                  break
          if not dep:
              print("NO_DEPLOY", flush=True)
              raise SystemExit(0)
          st, raw = call("POST", "/sites/" + S + "/deploys/" + dep + "/restore", {})
          print("RESTORE", st, flush=True)
          PY
          python3 pub.py
