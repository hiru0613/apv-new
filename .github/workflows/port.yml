name: ios-pin
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: patch
        run: |
          python3 - <<'PY'
          import io
          p = "components/desktop-shell.tsx"
          s = io.open(p, encoding="utf-8").read()
          HOOK = '''function useIosKeyboardPin() {
            useEffect(() => {
              if (typeof window === "undefined" || typeof document === "undefined") return;
              const vv = window.visualViewport;
              if (!vv) return;
              let raf = 0;
              let current = 0;
              const run = () => {
                raf = 0;
                const shell = document.querySelector(".phone-shell-wrap");
                if (!shell) return;
                const shrink = window.innerHeight - vv.height;
                if (shrink < 40) {
                  if (current !== 0) {
                    current = 0;
                    shell.style.transform = "";
                  }
                  return;
                }
                const bar = document.querySelector(".chat-input-bar");
                if (!bar) return;
                const visibleBottom = vv.offsetTop + vv.height;
                const base = bar.getBoundingClientRect().bottom + current;
                const need = base - visibleBottom;
                const next = need > 4 ? Math.round(need) : 0;
                if (Math.abs(next - current) < 2) return;
                current = next;
                shell.style.transform = next > 0 ? "translate3d(0,-" + next + "px,0)" : "";
              };
              const schedule = () => {
                if (!raf) raf = window.requestAnimationFrame(run);
              };
              const onOut = () => {
                window.setTimeout(schedule, 100);
              };
              vv.addEventListener("resize", schedule);
              vv.addEventListener("scroll", schedule);
              document.addEventListener("focusout", onOut, true);
              return () => {
                if (raf) window.cancelAnimationFrame(raf);
                vv.removeEventListener("resize", schedule);
                vv.removeEventListener("scroll", schedule);
                document.removeEventListener("focusout", onOut, true);
              };
            }, []);
          }

          '''
          s = s.replace("type MusicOverlayController = {", HOOK + "type MusicOverlayController = {", 1)
          s = s.replace("  useIosViewportPanReset();", "  useIosViewportPanReset();\n  useIosKeyboardPin();", 1)
          io.open(p, "w", encoding="utf-8").write(s)
          print("SHELL_OK")
          PY
          python3 - <<'PY'
          import io
          p = "components/viewport-debug-badge.tsx"
          s = io.open(p, encoding="utf-8").read()
          old = "                  + ` gap=${Math.round(window.innerHeight - (r?.bottom ?? 0))}`"
          new = old + "\n                  + ` sa=${(navigator as any).standalone ? 1 : 0} tf=${shell?.style.transform || \"-\"}`"
          if s.count(old) != 1:
              raise SystemExit("BAD_BADGE_ANCHOR")
          s = s.replace(old, new)
          io.open(p, "w", encoding="utf-8").write(s)
          print("BADGE_OK")
          PY
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add -A
          git commit -m "fix: 键盘上抬改为直接写 inline transform" || true
          git push origin HEAD:main
      - name: build-and-publish
        continue-on-error: true
        run: |
          cat > pub.py <<'PY'
          import json, time, urllib.request, urllib.error
          T = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          B = "https://api.netlify.com/api/v1"
          S = "aefc0064-d8ec-4516-876a-7433ae01d0f6"
          def call(m, p, body=None):
              d = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(B + p, data=d, method=m)
              r.add_header("Authorization", "Bearer " + T)
              r.add_header("Content-Type", "application/json")
              r.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(r, timeout=90) as x:
                      return x.status, x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:200]
              except Exception as e:
                  return 0, str(e)[:200]
          time.sleep(5)
          st, raw = call("POST", "/sites/" + S + "/builds?branch=main", {})
          try:
              bid = json.loads(raw)["id"]
          except Exception:
              print("NO_BUILD", st, raw[:120], flush=True)
              raise SystemExit(0)
          dep = None
          for i in range(40):
              time.sleep(10)
              st, raw = call("GET", "/sites/" + S + "/builds/" + bid)
              try:
                  d = json.loads(raw)
              except Exception:
                  continue
              dep = d.get("deploy_id") or dep
              if d.get("done"):
                  print("DONE", i, d.get("error"), flush=True)
                  break
          if not dep:
              raise SystemExit(0)
          st, raw = call("POST", "/sites/" + S + "/deploys/" + dep + "/restore", {})
          print("RESTORE", st, flush=True)
          PY
          python3 pub.py > cleanup.txt 2>&1 || true
          cat cleanup.txt
