name: port-filevault
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/filevault
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 修分支上的逗号
        run: |
          git config user.name "kong-bot"
          git config user.email "bot@local"
          python3 - <<'PY'
          import io
          p='middleware.ts'
          s=io.open(p,encoding='utf-8').read()
          bad='"/api/tool-proxy,"'
          good='"/api/tool-proxy",'
          if bad in s:
              io.open(p,'w',encoding='utf-8').write(s.replace(bad,good))
              print('branch fixed')
          else:
              print('branch already ok')
          PY
          git add -A
          git commit -m "fix: middleware 逗号位置" || true
          git push origin HEAD:feat/filevault

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: |
          npx tsc --noEmit > tsc.txt 2>&1 || true
          head -60 tsc.txt
          git add tsc.txt
          git commit -m "chore: tsc 结果" || true
          git push origin HEAD:feat/filevault

      - name: 顺手把 main 也修好
        run: |
          git fetch origin main
          git checkout -B fixmw origin/main
          python3 - <<'PY'
          import io
          p='middleware.ts'
          s=io.open(p,encoding='utf-8').read()
          bad='"/api/tool-proxy,"'
          good='"/api/tool-proxy",'
          if bad in s:
              io.open(p,'w',encoding='utf-8').write(s.replace(bad,good))
              print('main fixed')
          else:
              print('main already ok')
          PY
          git add -A
          git commit -m "fix: middleware 逗号位置" || true
          git push origin HEAD:main
