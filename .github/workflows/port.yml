name: port-filevault
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/filevault
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 接共享底座
        run: |
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git fetch origin dev main
          git checkout origin/dev -- lib/reading-parser.ts
          python3 - <<'PY'
          import io
          p = 'app/globals.css'
          s = io.open(p, encoding='utf-8').read()
          lines = s.split(chr(10))
          idx = max(i for i, l in enumerate(lines) if l.startswith('@import'))
          adds = ['chat-doc-import', 'mix-file-vault', 'worldbook-file-vault']
          extra = ['@import "../styles/' + a + '.css";' for a in adds if a not in s]
          io.open(p, 'w', encoding='utf-8').write(chr(10).join(lines[:idx+1] + extra + lines[idx+1:]))
          print('css added', len(extra))
          PY
          git add -A
          git commit -m "chore: 共享底座" || true
          git push origin HEAD:feat/filevault

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: |
          npx tsc --noEmit > tsc.txt 2>&1 || true
          head -60 tsc.txt
          git add tsc.txt
          git commit -m "chore: tsc 结果" || true
          git push origin HEAD:feat/filevault
