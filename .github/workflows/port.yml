name: publish-main
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: go
        continue-on-error: true
        run: |
          cat > go.py <<'PY'
          import json, urllib.request, urllib.error
          T = "nfp_nNxx2MaQHT8PtCjkjAkjeMCk8Y2Lwbfp1e1e"
          B = "https://api.netlify.com/api/v1"
          S = "aefc0064-d8ec-4513-876a-7433ae01d0f6"
          D = "6af00d5062cb039410df05c9"
          def call(m, p, body=None):
              d = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(B + p, data=d, method=m)
              r.add_header("Authorization", "Bearer " + T)
              r.add_header("Content-Type", "application/json")
              r.add_header("User-Agent", "kong-bot")
              try:
                  with urllib.request.urlopen(r, timeout=90) as x:
                      return x.status, x.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]
              except Exception as e:
                  return 0, str(e)[:200]
          st, raw = call("POST", "/sites/" + S + "/deploys/" + D + "/restore", {})
          print("RESTORE", st, raw[:300], flush=True)
          st, raw = call("GET", "/sites/" + S)
          try:
              d = json.loads(raw)
              pd = d.get("published_deploy") or {}
              print("LIVE branch=", pd.get("branch"), "sha=", str(pd.get("commit_ref"))[:10], "at=", pd.get("published_at"), flush=True)
          except Exception as e:
              print("READFAIL", e, flush=True)
          PY
          python3 go.py > netlify.txt 2>&1 || true
      - name: save
        if: always()
        run: |
          rm -f go.py
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git add netlify.txt
          git commit -m "chore: 发布 main 部署" || true
          git push origin HEAD:main
