name: port-filevault
on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 合并并记录冲突
        run: |
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git fetch origin dev main
          git checkout -B work origin/main
          rm -f result.txt
          if git merge origin/dev --allow-unrelated-histories --no-edit; then
            echo "MERGED_OK" > result.txt
          else
            echo "CONFLICT" > result.txt
            git diff --name-only --diff-filter=U >> result.txt
            git merge --abort || true
            git checkout -B work origin/main
          fi
          cat result.txt
          git add result.txt
          git commit -m "chore: merge result" || true
          git push origin work:feat/filevault --force
