name: port-filevault
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/filevault
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 自动补依赖并反复编译
        run: |
          git config user.name "kong-bot"
          git config user.email "bot@local"
          git fetch origin dev
          python3 - <<'PY'
          import io, re, subprocess
          for i in range(8):
              subprocess.run("npx tsc --noEmit > tsc.txt 2>&1", shell=True)
              s = io.open("tsc.txt", encoding="utf-8", errors="ignore").read()
              m = re.search(r"Cannot find module '(\./[^']+)'", s)
              if not m:
                  print("NO_MISSING_MODULE")
                  break
              mod = m.group(1)
              name = mod.split("/")[-1]
              done = False
              for cand in ["lib/" + name + ".ts", name + ".ts"]:
                  r = subprocess.run(["git", "cat-file", "-e", "origin/dev:" + cand])
                  if r.returncode == 0:
                      subprocess.run(["git", "checkout", "origin/dev", "--", cand])
                      print("copied", cand)
                      done = True
                      break
              if not done:
                  print("CANNOT_RESOLVE", mod)
                  break
          print("---- tsc ----")
          print(io.open("tsc.txt", encoding="utf-8", errors="ignore").read()[:3000])
          PY
          git add -A
          git commit -m "chore: 自动补依赖 + tsc" || true
          git push origin HEAD:feat/filevault
